<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640"><rect width="1600" height="640" fill="#FFFFFF"/><rect x="20" y="20" width="770" height="600" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="50" y="70" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Typical robot: reacts</text><text x="50" y="112" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">brakes only for what is in front of it</text><rect x="50" y="190" width="710" height="200" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><line x1="50" y1="190" x2="450" y2="190" stroke="#101820" stroke-width="6"/><line x1="530" y1="190" x2="760" y2="190" stroke="#101820" stroke-width="6"/><line x1="50" y1="390" x2="450" y2="390" stroke="#101820" stroke-width="6"/><line x1="530" y1="390" x2="760" y2="390" stroke="#101820" stroke-width="6"/><line x1="80" y1="290" x2="740" y2="290" stroke="#C3CCD4" stroke-width="4" stroke-dasharray="12 8"/><path d="M740,290 L725.6,297.0 L725.6,283.0 z" fill="#C3CCD4"/><text x="720" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="end" dominant-baseline="middle">route</text><circle cx="490" cy="149" r="9" fill="#D9A441" stroke="none" stroke-width="2"/><rect x="479" y="160" width="22" height="28" rx="8" fill="#D9A441" stroke="#D9A441" stroke-width="2"/><line x1="490" y1="190" x2="490" y2="380" stroke="#D9A441" stroke-width="4"/><path d="M490,380 L483.0,365.6 L497.0,365.6 z" fill="#D9A441"/><circle cx="415" cy="290" r="26" fill="#FFFFFF" stroke="#7C5CE0" stroke-width="4"/><path d="M423,280 L437,290 L423,300 z" fill="#7C5CE0"/><circle cx="490" cy="290" r="34" fill="#FBE7E5" stroke="#C0352A" stroke-width="4"/><text x="490" y="292" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#C0352A" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">!</text><text x="50" y="440" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Stops at 0.3 m, but the person keeps walking</text><text x="50" y="474" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">and walks into the stopped robot.</text><text x="50" y="560" font-family="Arial, Helvetica, sans-serif" font-size="64" fill="#C0352A" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">2</text><text x="110" y="548" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">collisions in 9 crossing runs</text><text x="110" y="580" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">goal reached 7/9</text><rect x="810" y="20" width="770" height="600" rx="14" fill="#E2F2F0" stroke="#0B7D73" stroke-width="2"/><text x="840" y="70" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#0B7D73" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">VISTARA-X: predicts</text><text x="840" y="112" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">plans for where the person will be</text><rect x="840" y="190" width="710" height="200" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><line x1="840" y1="190" x2="1240" y2="190" stroke="#101820" stroke-width="6"/><line x1="1320" y1="190" x2="1550" y2="190" strok
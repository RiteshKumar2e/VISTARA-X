 font-style="normal" text-anchor="middle" dominant-baseline="middle">slows to 50%</text><text x="840" y="440" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Sees the person's path 2.8 s ahead,</text><text x="840" y="474" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">slows early and passes after them.</text><text x="840" y="560" font-family="Arial, Helvetica, sans-serif" font-size="64" fill="#0B7D73" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">0</text><text x="900" y="548" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">collisions in 9 crossing runs</text><text x="900" y="580" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">goal reached 9/9</text></svg>
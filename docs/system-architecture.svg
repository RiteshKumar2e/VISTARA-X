<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680"><rect width="1600" height="680" fill="#FFFFFF"/><text x="20" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4B5866" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">USER</text><rect x="20" y="50" width="250" height="110" rx="14" fill="#FDF1DC" stroke="#D9A441" stroke-width="2"/><text x="40" y="88" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Voice</text><text x="40" y="126" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">English, Hindi, Hinglish</text><rect x="20" y="180" width="250" height="110" rx="14" fill="#FDF1DC" stroke="#D9A441" stroke-width="2"/><text x="40" y="218" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Dashboard</text><text x="40" y="256" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">browser or phone</text><line x1="270" y1="105" x2="328" y2="105" stroke="#4B5866" stroke-width="4"/><path d="M328,105 L313.6,112.0 L313.6,98.0 z" fill="#4B5866"/><line x1="330" y1="235" x2="272" y2="235" stroke="#4B5866" stroke-width="4"/><path d="M272,235 L286.4,228.0 L286.4,242.0 z" fill="#4B5866"/><text x="20" y="380" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4B5866" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">SENSORS</text><rect x="20" y="400" width="250" height="54" rx="27" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="145" y="428" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">USB webcam</text><rect x="20" y="466" width="250" height="54" rx="27" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="145" y="494" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">RPLIDAR A1M8</text><line x1="270" y1="427" x2="328" y2="427" stroke="#4B5866" stroke-width="4"/><path d="M328,427 L313.6,434.0 L313.6,420.0 z" fill="#4B5866"/><line x1="270" y1="493" x2="328" y2="493" stroke="#4B5866" stroke-width="4"/><path d="M328,493 L313.6,500.0 L313.6,486.0 z" fill="#4B5866"/><rect x="330" y="50" width="820" height="470" rx="14" fill="#E2F2F0" stroke="#0B7D73" stroke-width="3"/><text x="355" y="85" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#0B7D73" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">LAPTOP · VISTARA-X backend</text><text x="1125" y="85" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="end" dominant-baseline="middle">Python · FastAPI · React</text><rect x="355" y="115" width="245" height="112" rx="14" fill="#FFFFFF" stroke="#C3CCD4" stroke-width="2"/><text x="373" y="155" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Speech + commands</text><text x="373" y="193" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Whisper, intent parser</text><rect x="617" y="115" width="245" height="112" rx="14" fill="#FFFFFF" stroke="#C3CCD4" stroke-width="2"/><text x="635" y="155" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Perception</text><text x="635" y="193" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">YOLOv8 on camera frames</text><rect x="879" y="115" width="245" height="112" rx="14" fill="#FDF1DC" stroke="#D9A441" stroke-width="2"/><text x="897" y="155" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Tracking + prediction</text><text x="897" y="193" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Kalman, 0.5 to 3 s ahead</text><rect x="355" y="245" width="245" height="112" rx="14" fill="#FFFFFF" stroke="#C3CCD4" stroke-width="2"/><text x="373" y="285" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">SLAM map</text><text x="373" y="323" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">LiDAR scan matching</text><rect x="617" y="245" width="245" height="112" rx="14" fill="#FFFFFF" stroke="#C3CCD4" stroke-width="2"/><text x="635" y="285" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Planner + control</text><text x="635" y="323" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">A*, pure pursuit</text><rect x="879" y="245" width="245" height="112" rx="14" fill="#FFFFFF" stroke="#C3CCD4" stroke-width="2"/><text x="897" y="285" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Missions + UI</text><text x="897" y="323" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">delivery, PIN, live dashboard</text><text x="355" y="400" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Every decision is written out, for example:</text><rect x="355" y="418" width="770" height="48" rx="10" fill="#0D1114" stroke="#0D1114" stroke-width="2"/><text x="375" y="443" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2FD6C6" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Predicted path conflict with track 1 (person) in 2.8 s: slowing to 50%</text><text x="355" y="495" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4B5866" font-weight="normal" font-style="italic" text-anchor="start" dominant-baseline="middle">Runs today against the PyBullet simulation, no hardware needed.</text><line x1="1150" y1="230" x2="1238" y2="230" stroke="#0B7D73" stroke-width="5"/><path d="M1238,230 L1223.6,237.0 L1223.6,223.0 z" fill="#0B7D73"/><text x="1195" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0B7D73" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">v, ω</text><text x="1195" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0B7D73" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle">20 Hz</text><text x="1195" y="300" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle">USB / BT</text><line x1="1240" y1="340" x2="1152" y2="340" stroke="#4B5866" stroke-width="5"/><path d="M1152,340 L1166.4,333.0 L1166.4,347.0 z" fill="#4B5866"/><text x="1195" y="370" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle">telemetry</text><text x="1195" y="392" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4B5866" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle">10 Hz</text><rect x="1240" y="50" width="340" height="470" rx="14" fill="#0D1114" stroke="#0D1114" stroke-width="2"/><text x="1410" y="92" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">ARDUINO MEGA</text><text x="1410" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2FD6C6" font-weight="normal" font-style="normal" text-anchor="middle" dominant-baseline="middle">real-time safety layer</text><text x="1262" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">No command 0.5 s</text><text x="1560" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FF8A7A" font-weight="bold" font-style="normal" text-anchor="end" dominant-baseline="middle">stop</text><text x="1262" y="221" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Obstacle &lt; 0.9 m</text><text x="1560" y="221" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#D9A441" font-weight="bold" font-style="normal" text-anchor="end" dominant-baseline="middle">slow</text><text x="1262" y="267" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Obstacle &lt; 0.3 m</text><text x="1560" y="267" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FF8A7A" font-weight="bold" font-style="normal" text-anchor="end" dominant-baseline="middle">stop</text><text x="1262" y="313" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">E-stop / battery</text><text x="1560" y="313" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FF8A7A" font-weight="bold" font-style="normal" text-anchor="end" dominant-baseline="middle">stop</text><text x="1262" y="380" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#C3CCD4" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">In: 6 ultrasonic, IMU,</text><text x="1262" y="406" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#C3CCD4" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">2 encoders, E-stop</text><text x="1262" y="450" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#C3CCD4" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Out: motor PWM,</text><text x="1262" y="476" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#C3CCD4" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">buzzer, status LED</text><line x1="1410" y1="520" x2="1410" y2="576" stroke="#4B5866" stroke-width="4"/><path d="M1410,576 L1403.0,561.6 L1417.0,561.6 z" fill="#4B5866"/><rect x="1240" y="580" width="340" height="80" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="1410" y="620" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">MDD3A driver → 2 motors</text><rect x="330" y="566" width="820" height="94" rx="14" fill="#FBE7E5" stroke="#C0352A" stroke-width="2"/><text x="355" y="598" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#C0352A" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">SAFETY DOES NOT DEPEND ON AI</text><text x="355" y="634" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">If the laptop freezes, the Arduino stops in 0.5 s. The E-STOP cuts motor power in hardware.</text></svg>
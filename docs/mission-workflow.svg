<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><rect width="1600" height="720" fill="#FFFFFF"/><text x="20" y="22" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0B7D73" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">WHAT THE USER SEES</text><rect x="20" y="45" width="280" height="270" rx="14" fill="#E2F2F0" stroke="#0B7D73" stroke-width="2"/><circle cx="58" cy="88" r="22" fill="#0B7D73"/><text x="58" y="89" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">1</text><text x="92" y="89" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Ask</text><text x="42" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">“Pharmacy se</text><text x="42" y="184" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Ward B tak</text><text x="42" y="218" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">dawai le jao”</text><text x="42" y="284" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4B5866" font-weight="normal" font-style="italic" text-anchor="start" dominant-baseline="middle">voice or dashboard</text><line x1="304" y1="180" x2="326" y2="180" stroke="#4B5866" stroke-width="4"/><path d="M322,171 L336,180 L322,189 z" fill="#4B5866"/><rect x="20" y="375" width="280" height="230" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="42" y="415" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Whisper turns speech</text><text x="42" y="449" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">into text; parser reads</text><text x="42" y="483" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Hindi, English, Hinglish</text><rect x="42" y="540" width="150" height="40" rx="20" fill="#101820"/><text x="117.0" y="561" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">Laptop mic</text><line x1="160.0" y1="315" x2="160.0" y2="375" stroke="#C3CCD4" stroke-width="3" stroke-dasharray="6 6"/><rect x="340" y="45" width="280" height="270" rx="14" fill="#E2F2F0" stroke="#0B7D73" stroke-width="2"/><circle cx="378" cy="88" r="22" fill="#0B7D73"/><text x="378" y="89" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">2</text><text x="412" y="89" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Confirm</text><text x="362" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">“Pharmacy → Ward B.</text><text x="362" y="184" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Start?”</text><text x="362" y="284" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4B5866" font-weight="normal" font-style="italic" text-anchor="start" dominant-baseline="middle">nurse taps Yes</text><line x1="624" y1="180" x2="646" y2="180" stroke="#4B5866" stroke-width="4"/><path d="M642,171 L656,180 L642,189 z" fill="#4B5866"/><rect x="340" y="375" width="280" height="230" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="362" y="415" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Checks the place exists</text><text x="362" y="449" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">and can be reached.</text><text x="362" y="483" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Nothing moves before Yes</text><rect x="362" y="540" width="102" height="40" rx="20" fill="#101820"/><text x="413.0" y="561" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">Laptop</text><line x1="480.0" y1="315" x2="480.0" y2="375" stroke="#C3CCD4" stroke-width="3" stroke-dasharray="6 6"/><rect x="660" y="45" width="280" height="270" rx="14" fill="#E2F2F0" stroke="#0B7D73" stroke-width="2"/><circle cx="698" cy="88" r="22" fill="#0B7D73"/><text x="698" y="89" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">3</text><text x="732" y="89" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Plan</text><text x="682" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Route drawn on</text><text x="682" y="184" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">the live map</text><text x="682" y="284" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4B5866" font-weight="normal" font-style="italic" text-anchor="start" dominant-baseline="middle">staff loads the item</text><line x1="944" y1="180" x2="966" y2="180" stroke="#D9A441" stroke-width="4"/><path d="M962,171 L976,180 L962,189 z" fill="#D9A441"/><rect x="660" y="375" width="280" height="230" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="682" y="415" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">LiDAR builds the map</text><text x="682" y="449" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">(SLAM); A* finds the</text><text x="682" y="483" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">shortest safe route</text><rect x="682" y="540" width="90" height="40" rx="20" fill="#101820"/><text x="727.0" y="561" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">LiDAR</text><line x1="800.0" y1="315" x2="800.0" y2="375" stroke="#C3CCD4" stroke-width="3" stroke-dasharray="6 6"/><rect x="980" y="45" width="280" height="270" rx="14" fill="#FDF1DC" stroke="#D9A441" stroke-width="2"/><circle cx="1018" cy="88" r="22" fill="#D9A441"/><text x="1018" y="89" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">4</text><text x="1052" y="89" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Drive safely</text><text x="1002" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">“Person crossing</text><text x="1002" y="184" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">in 1.8 s: slowing</text><text x="1002" y="218" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">to 50%”</text><text x="1002" y="284" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4B5866" font-weight="normal" font-style="italic" text-anchor="start" dominant-baseline="middle">reason shown live</text><line x1="1264" y1="180" x2="1286" y2="180" stroke="#4B5866" stroke-width="4"/><path d="M1282,171 L1296,180 L1282,189 z" fill="#4B5866"/><rect x="980" y="375" width="280" height="230" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="1002" y="415" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Camera spots a person;</text><text x="1002" y="449" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">LiDAR predicts 3 s ahead</text><text x="1002" y="483" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">→ slow, wait, re-route</text><rect x="1002" y="540" width="198" height="40" rx="20" fill="#D9A441"/><text x="1101.0" y="561" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">Camera + LiDAR</text><line x1="1120.0" y1="315" x2="1120.0" y2="375" stroke="#C3CCD4" stroke-width="3" stroke-dasharray="6 6"/><rect x="1300" y="45" width="280" height="270" rx="14" fill="#E2F2F0" stroke="#0B7D73" stroke-width="2"/><circle cx="1338" cy="88" r="22" fill="#0B7D73"/><text x="1338" y="89" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">5</text><text x="1372" y="89" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">Deliver</text><text x="1322" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Arrives at Ward B</text><text x="1322" y="184" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101820" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">PIN 4821 ✓</text><text x="1322" y="284" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4B5866" font-weight="normal" font-style="italic" text-anchor="start" dominant-baseline="middle">proof of delivery</text><rect x="1300" y="375" width="280" height="230" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="1322" y="415" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Recipient enters the PIN;</text><text x="1322" y="449" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">log and report saved;</text><text x="1322" y="483" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">low battery → dock</text><rect x="1322" y="540" width="138" height="40" rx="20" fill="#101820"/><text x="1391.0" y="561" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">Dashboard</text><line x1="1440.0" y1="315" x2="1440.0" y2="375" stroke="#C3CCD4" stroke-width="3" stroke-dasharray="6 6"/><rect x="14" y="336" width="250" height="32" fill="#FFFFFF"/><text x="20" y="352" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4B5866" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">WHAT VISTARA-X DOES</text><rect x="20" y="628" width="1560" height="76" rx="14" fill="#FBE7E5" stroke="#C0352A" stroke-width="2"/><text x="44" y="666" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#C0352A" font-weight="bold" font-style="normal" text-anchor="start" dominant-baseline="middle">ALWAYS ON</text><text x="205" y="666" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#101820" font-weight="normal" font-style="normal" text-anchor="start" dominant-baseline="middle">Arduino safety: stop if no command for 0.5 s · slow at 0.9 m · stop at 0.3 m · E-STOP cuts the wheels.   Dashboard: live map, robot and predicted paths.</text></svg>
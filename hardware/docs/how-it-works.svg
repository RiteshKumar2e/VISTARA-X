<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><defs><marker id="a4B5866" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5866"/></marker><marker id="a0B7D73" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B7D73"/></marker><marker id="aC0352A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0352A"/></marker><marker id="aD9A441" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9A441"/></marker><marker id="a101820" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#101820"/></marker></defs><rect width="1600" height="700" fill="#FFFFFF"/><circle cx="38" cy="32" r="18" fill="#0B7D73"/><text x="38" y="33" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1</text><text x="68" y="33" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#0B7D73" font-weight="bold" text-anchor="start" dominant-baseline="middle">SENSE: what the robot feels</text><rect x="20" y="70" width="500" height="108" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="42" y="104" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#101820" font-weight="bold" text-anchor="start" dominant-baseline="middle">Ultrasonic × 6</text><rect x="388.5" y="87" width="111.5" height="34" rx="17" fill="#0B7D73"/><text x="444.25" y="105" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">D30–D41</text><text x="42" y="146" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4B5866" font-weight="normal" text-anchor="start" dominant-baseline="middle">Distance to obstacles all around</text><polyline points="520,124 560,124" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round"/><rect x="20" y="192" width="500" height="108" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="42" y="226" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#101820" font-weight="bold" text-anchor="start" dominant-baseline="middle">Wheel encoders</text><rect x="401.0" y="209" width="99.0" height="34" rx="17" fill="#0B7D73"/><text x="450.5" y="227" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">D2, D3</text><text x="42" y="268" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4B5866" font-weight="normal" text-anchor="start" dominant-baseline="middle">How fast each wheel turns</text><polyline points="520,246 560,246" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round"/><rect x="20" y="314" width="500" height="108" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="42" y="348" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#101820" font-weight="bold" text-anchor="start" dominant-baseline="middle">MPU6050 IMU</text><rect x="376.0" y="331" width="124.0" height="34" rx="17" fill="#0B7D73"/><text x="438.0" y="349" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">D20, D21</text><text x="42" y="390" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4B5866" font-weight="normal" text-anchor="start" dominant-baseline="middle">How fast the robot is turning</text><polyline points="520,368 560,368" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round"/><rect x="20" y="436" width="500" height="108" rx="14" fill="#FBE7E5" stroke="#C0352A" stroke-width="2"/><text x="42" y="470" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#C0352A" font-weight="bold" text-anchor="start" dominant-baseline="middle">E-STOP + battery</text><rect x="388.5" y="453" width="111.5" height="34" rx="17" fill="#C0352A"/><text x="444.25" y="471" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">D26, A0</text><text x="42" y="512" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4B5866" font-weight="normal" text-anchor="start" dominant-baseline="middle">Emergency button, battery level</text><polyline points="520,490 560,490" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round"/><polyline points="560,124 560,490" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round"/><polyline points="560,420 612,420" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round" marker-end="url(#a4B5866)"/><circle cx="638" cy="32" r="18" fill="#101820"/><text x="638" y="33" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">2</text><text x="668" y="33" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#101820" font-weight="bold" text-anchor="start" dominant-baseline="middle">THINK + DECIDE</text><rect x="620" y="70" width="360" height="128" rx="14" fill="#E2F2F0" stroke="#0B7D73" stroke-width="2"/><text x="800" y="106" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#101820" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Laptop: the AI brain</text><text x="800" y="146" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4B5866" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Sees, maps, predicts</text><text x="800" y="176" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4B5866" font-weight="normal" text-anchor="middle" dominant-baseline="middle">people, plans the route</text><polyline points="740,198 740,270" fill="none" stroke="#0B7D73" stroke-width="4" stroke-linejoin="round" marker-end="url(#a0B7D73)"/><polyline points="860,272 860,200" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round" marker-end="url(#a4B5866)"/><text x="728" y="234" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0B7D73" font-weight="bold" text-anchor="end" dominant-baseline="middle">speed</text><text x="728" y="258" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0B7D73" font-weight="bold" text-anchor="end" dominant-baseline="middle">command</text><text x="872" y="234" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4B5866" font-weight="bold" text-anchor="start" dominant-baseline="middle">sensor</text><text x="872" y="258" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4B5866" font-weight="bold" text-anchor="start" dominant-baseline="middle">data</text><rect x="620" y="280" width="360" height="282" rx="14" fill="#0D1114" stroke="#0D1114" stroke-width="2"/><text x="800" y="318" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Arduino Mega</text><text x="800" y="352" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2FD6C6" font-weight="normal" text-anchor="middle" dominant-baseline="middle">safety rules, every 20 ms</text><text x="640" y="396" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start" dominant-baseline="middle">No command for 0.5 s</text><text x="962" y="396" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FF8A7A" font-weight="bold" text-anchor="end" dominant-baseline="middle">→ stop</text><text x="640" y="438" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start" dominant-baseline="middle">Obstacle under 0.9 m</text><text x="962" y="438" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#D9A441" font-weight="bold" text-anchor="end" dominant-baseline="middle">→ slow</text><text x="640" y="480" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start" dominant-baseline="middle">Obstacle under 0.3 m</text><text x="962" y="480" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FF8A7A" font-weight="bold" text-anchor="end" dominant-baseline="middle">→ stop</text><text x="640" y="522" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="normal" text-anchor="start" dominant-baseline="middle">E-stop or empty battery</text><text x="962" y="522" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FF8A7A" font-weight="bold" text-anchor="end" dominant-baseline="middle">→ stop</text><circle cx="1098" cy="32" r="18" fill="#D9A441"/><text x="1098" y="33" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">3</text><text x="1128" y="33" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#D9A441" font-weight="bold" text-anchor="start" dominant-baseline="middle">ACT: what the robot does</text><polyline points="980,420 1040,420" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round"/><polyline points="1040,140 1040,490" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round"/><rect x="1080" y="70" width="500" height="140" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="1102" y="112" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#101820" font-weight="bold" text-anchor="start" dominant-baseline="middle">Motors + driver</text><rect x="1473.5" y="95" width="86.5" height="34" rx="17" fill="#D9A441"/><text x="1516.75" y="113" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">D5–D8</text><text x="1102" y="160" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4B5866" font-weight="normal" text-anchor="start" dominant-baseline="middle">Turns signals into wheel power</text><polyline points="1040,140.0 1076,140.0" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round" marker-end="url(#a4B5866)"/><rect x="1080" y="233" width="500" height="140" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="1102" y="275" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#101820" font-weight="bold" text-anchor="start" dominant-baseline="middle">Buzzer</text><rect x="1498.5" y="258" width="61.5" height="34" rx="17" fill="#D9A441"/><text x="1529.25" y="276" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">D28</text><text x="1102" y="323" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4B5866" font-weight="normal" text-anchor="start" dominant-baseline="middle">Beeps when there is danger</text><polyline points="1040,303.0 1076,303.0" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round" marker-end="url(#a4B5866)"/><rect x="1080" y="396" width="500" height="140" rx="14" fill="#F3F5F7" stroke="#C3CCD4" stroke-width="2"/><text x="1102" y="438" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#101820" font-weight="bold" text-anchor="start" dominant-baseline="middle">Status LED</text><rect x="1498.5" y="421" width="61.5" height="34" rx="17" fill="#D9A441"/><text x="1529.25" y="439" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">D13</text><text x="1102" y="486" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4B5866" font-weight="normal" text-anchor="start" dominant-baseline="middle">Solid OK · blink alarm</text><polyline points="1040,466.0 1076,466.0" fill="none" stroke="#4B5866" stroke-width="4" stroke-linejoin="round" marker-end="url(#a4B5866)"/><rect x="20" y="590" width="1560" height="96" rx="14" fill="#FBE7E5" stroke="#C0352A" stroke-width="2"/><text x="44" y="624" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#C0352A" font-weight="bold" text-anchor="start" dominant-baseline="middle">POWER</text><text x="44" y="664" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101820" font-weight="normal" text-anchor="start" dominant-baseline="middle">Laptop USB → Arduino + all sensors (5 V).  The E-stop cuts only the wheels: the brain keeps running.</text><rect x="200" y="603" width="186" height="40" rx="20" fill="#FFFFFF" stroke="#C0352A" stroke-width="2"/><text x="293.0" y="624" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101820" font-weight="bold" text-anchor="middle" dominant-baseline="middle">12 V battery</text><polyline points="390,623 416,623" fill="none" stroke="#C0352A" stroke-width="3" stroke-linejoin="round" marker-end="url(#aC0352A)"/><rect x="420" y="603" width="82" height="40" rx="20" fill="#FFFFFF" stroke="#C0352A" stroke-width="2"/><text x="461.0" y="624" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101820" font-weight="bold" text-anchor="middle" dominant-baseline="middle">fuse</text><polyline points="506,623 532,623" fill="none" stroke="#C0352A" stroke-width="3" stroke-linejoin="round" marker-end="url(#aC0352A)"/><rect x="536" y="603" width="108" height="40" rx="20" fill="#FFFFFF" stroke="#C0352A" stroke-width="2"/><text x="590.0" y="624" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101820" font-weight="bold" text-anchor="middle" dominant-baseline="middle">switch</text><polyline points="648,623 674,623" fill="none" stroke="#C0352A" stroke-width="3" stroke-linejoin="round" marker-end="url(#aC0352A)"/><rect x="678" y="603" width="108" height="40" rx="20" fill="#C0352A" stroke="#C0352A" stroke-width="2"/><text x="732.0" y="624" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">E-STOP</text><polyline points="790,623 816,623" fill="none" stroke="#C0352A" stroke-width="3" stroke-linejoin="round" marker-end="url(#aC0352A)"/><rect x="820" y="603" width="186" height="40" rx="20" fill="#FFFFFF" stroke="#C0352A" stroke-width="2"/><text x="913.0" y="624" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101820" font-weight="bold" text-anchor="middle" dominant-baseline="middle">motor driver</text></svg>